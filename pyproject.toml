[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's concern, not a lint gate

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
# Ratchet just below the current ~44% so testable logic can't silently regress.
fail_under = 40
